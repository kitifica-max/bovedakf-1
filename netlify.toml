[build]
  command = "npm run build"
  publish = ".next"

[[scheduled-functions]]
  name = "check-subscriptions"
  schedule = "0 8 * * *"
  path = "/api/cron/check-subscriptions"

[[edge_functions]]
  function = "waf"
  path = "/*"
  excludedPath = ["/_next/static/*", "/_next/image*", "/favicon.ico"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Fonts need CORP: cross-origin so browsers allow them when COEP: require-corp
# is active. next.config.ts sets same-origin for all other resources.
[[headers]]
  for = "/_next/static/media/*"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/_next/static/chunks/*"
  [headers.values]
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
