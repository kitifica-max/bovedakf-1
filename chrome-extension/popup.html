<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bóveda KF-1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0 }

  :root {
    --cream: #FAF7F2;
    --ink: #1A1A1A;
    --ink-soft: #6B6560;
    --blue: #2B4EAF;
    --blue-bg: rgba(43, 78, 175, 0.08);
    --blue-border: rgba(43, 78, 175, 0.25);
    --border: #E5E0D8;
    --white: #FFFFFF;
    --success: #16A34A;
    --error: #DC2626;
  }

  body {
    width: 360px;
    min-height: 80px;
    background: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    color: var(--ink);
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--white);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: -0.01em;
  }

  .logo-shield {
    width: 26px;
    height: 26px;
    background: var(--blue);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gear-btn {
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    transition: background 0.15s;
  }
  .gear-btn:hover { background: var(--border) }

  /* ── Setup screen ── */
  .setup {
    padding: 20px 16px 16px;
  }

  .setup h2 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 5px;
  }

  .setup p {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 16px;
    line-height: 1.55;
  }

  .input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--white);
    font-size: 13px;
    color: var(--ink);
    margin-bottom: 8px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .input:focus { border-color: var(--blue) }

  .btn-primary {
    width: 100%;
    padding: 9px;
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
    margin-bottom: 12px;
  }
  .btn-primary:hover { opacity: 0.88 }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed }

  .link-hint {
    font-size: 12px;
    color: var(--blue);
    text-decoration: none;
    display: block;
    text-align: center;
  }
  .link-hint:hover { text-decoration: underline }

  /* ── Domain bar ── */
  .domain-bar {
    padding: 6px 14px;
    font-size: 11px;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--border);
    background: var(--white);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* ── Search ── */
  .search-wrap {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--white);
  }

  .search {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--cream);
    font-size: 13px;
    color: var(--ink);
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .search:focus { border-color: var(--blue) }

  /* ── Credential list ── */
  .cred-list {
    max-height: 320px;
    overflow-y: auto;
  }

  .cred-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
  }
  .cred-item:hover { background: var(--white) }
  .cred-item:last-child { border-bottom: none }

  .cred-icon {
    width: 32px;
    height: 32px;
    background: var(--blue-bg);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 700;
    color: var(--blue);
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }

  .cred-info { flex: 1; min-width: 0 }

  .cred-service {
    font-weight: 600;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cred-user {
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  .fill-btn {
    flex-shrink: 0;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: none;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .fill-btn:hover {
    background: var(--blue-bg);
    color: var(--blue);
    border-color: var(--blue-border);
  }
  .fill-btn.filling {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ── Suggestions badge ── */
  .suggested-label {
    padding: 5px 14px 3px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--border);
    background: var(--cream);
  }

  /* ── Empty / loading / error states ── */
  .state-center {
    padding: 32px 16px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    line-height: 1.5;
  }

  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-bottom: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg) } }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 10px;
    left: 10px;
    right: 10px;
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 500;
    text-align: center;
    z-index: 999;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
  .toast.success { background: var(--success); color: white }
  .toast.error   { background: var(--error);   color: white }

  /* ── Settings overlay ── */
  .settings-panel {
    padding: 16px;
    border-top: 1px solid var(--border);
    background: var(--white);
  }

  .settings-panel p {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 10px;
    line-height: 1.4;
  }

  .btn-danger {
    padding: 7px 14px;
    border: 1px solid #FECACA;
    border-radius: 7px;
    background: #FEF2F2;
    color: var(--error);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .btn-danger:hover { background: #FEE2E2 }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-shield">
      <svg width="14" height="16" viewBox="0 0 14 16" fill="none">
        <path d="M7 1L1 3.5V8C1 11.5 3.8 14.7 7 15.5C10.2 14.7 13 11.5 13 8V3.5L7 1Z" fill="white" opacity="0.9"/>
        <path d="M4.5 8L6.2 9.7L9.5 6.4" stroke="#2B4EAF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    Bóveda KF-1
  </div>
  <button class="gear-btn" id="gearBtn" title="Configuración">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <circle cx="7" cy="7" r="2" stroke="currentColor" stroke-width="1.3"/>
      <path d="M7 1.5V3M7 11v1.5M1.5 7H3M11 7h1.5M3.05 3.05l1.06 1.06M9.89 9.89l1.06 1.06M10.95 3.05L9.89 4.11M4.11 9.89L3.05 10.95" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
  </button>
</div>

<div id="app"></div>
<div id="settingsPanel" class="settings-panel" style="display:none">
  <p>Conectado a kf1.kitifica.com. Para cambiar el token, desconectá tu cuenta.</p>
  <button class="btn-danger" id="disconnectBtn">Desconectar cuenta</button>
</div>
<div class="toast" id="toast"></div>

<script src="popup.js"></script>
</body>
</html>
