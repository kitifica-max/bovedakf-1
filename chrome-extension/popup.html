<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bóveda KF-1</title>
<style>
  @font-face { font-family: "Barlow KF"; font-weight: 800; src: url("fonts/BarlowCondensed-800.woff2") format("woff2"); }
  @font-face { font-family: "Montserrat KF"; font-weight: 100 900; src: url("fonts/Montserrat-VF.woff2") format("woff2"); }

  * { box-sizing: border-box; margin: 0; padding: 0 }

  /* Brand tokens (same values as the web app's globals.css) */
  :root {
    --tinta: #1b2340;
    --tinta-suave: #5b6383;
    --niebla: #eef0f6;
    --borde: #e4e7f0;
    --azul: #1f6fb2;
    --azul-hondo: #1b5a93;
    --carmesi: #b31f47;
    --carmesi-hondo: #a81b42;
    --manteca: #ffd27a;
    --bosque: #0b6845;
    --lima: #b9e35a;
    --display: "Barlow KF", "Arial Narrow", sans-serif;
    --sans: "Montserrat KF", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  body {
    width: 360px;
    min-height: 120px;
    background: #fff;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    color: var(--tinta);
  }

  /* Two-tone focus ring: visible on any ground */
  :focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px; box-shadow: 0 0 0 3px #fff; }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: var(--carmesi);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--display);
    font-weight: 800;
    font-size: 26px;
    line-height: 1;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--manteca);
  }
  .logo svg { display: block; flex-shrink: 0 }

  .gear-btn {
    width: 40px;
    height: 40px;
    border: 2px solid var(--manteca);
    border-radius: 999px;
    background: none;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: var(--manteca);
    transition: background 0.15s, color 0.15s;
  }
  .gear-btn:hover { background: var(--manteca); color: var(--carmesi-hondo) }

  /* ── Setup screen ── */
  .setup {
    padding: 22px 18px 18px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }
  .setup .star { width: 64px; height: 64px; margin-bottom: 2px }

  .setup h2 {
    font-family: var(--display);
    font-weight: 800;
    font-size: 34px;
    line-height: 1.02;
    text-transform: uppercase;
    color: var(--azul);
  }

  .setup p {
    font-size: 12.5px;
    color: var(--tinta-suave);
    line-height: 1.6;
    margin-bottom: 4px;
  }

  .input {
    width: 100%;
    height: 44px;
    padding: 0 18px;
    border: 2px solid var(--borde);
    border-radius: 999px;
    background: #fff;
    font-size: 13px;
    font-weight: 600;
    color: var(--tinta);
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .input::placeholder { color: var(--tinta-suave); font-weight: 500 }
  .input:focus { border-color: var(--azul) }
  .input:focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px }

  .btn-primary {
    width: 100%;
    min-height: 44px;
    padding: 0 18px;
    background: var(--azul);
    color: #fff;
    border: none;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.9 }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed }

  .link-hint {
    font-size: 12px;
    font-weight: 700;
    color: var(--azul-hondo);
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 3px;
    display: inline-flex;
    align-items: center;
    min-height: 32px;
  }

  /* ── Domain bar ── */
  .domain-bar {
    margin: 12px 12px 0;
    padding: 7px 14px;
    font-size: 11px;
    font-weight: 700;
    color: var(--tinta-suave);
    background: var(--niebla);
    border-radius: 999px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .domain-bar svg { flex-shrink: 0 }

  /* ── Search ── */
  .search-wrap { padding: 12px 12px 4px }

  .search {
    width: 100%;
    height: 44px;
    padding: 0 18px;
    border: 2px solid var(--borde);
    border-radius: 999px;
    background: #fff;
    font-size: 13px;
    font-weight: 600;
    color: var(--tinta);
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .search::placeholder { color: var(--tinta-suave); font-weight: 500 }
  .search:focus { border-color: var(--azul) }
  .search:focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px }

  /* ── Credential list: one color-paired card per account ── */
  .cred-list {
    max-height: 340px;
    overflow-y: auto;
    padding: 8px 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .cred-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 10px 10px 12px;
    border-radius: 22px;
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .cred-item:hover { transform: translateY(-1px) }

  /* Starburst initial badge */
  .cred-icon {
    position: relative;
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    font-family: var(--display);
    font-weight: 800;
    font-size: 17px;
    line-height: 1;
    text-transform: uppercase;
    color: var(--star-ink);
  }
  .cred-icon svg { position: absolute; inset: 0; width: 100%; height: 100% }
  .cred-icon span { position: relative }

  .cred-info { flex: 1; min-width: 0 }

  .cred-service {
    font-family: var(--display);
    font-weight: 800;
    font-size: 21px;
    line-height: 1.05;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cred-user {
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
    opacity: 0.9;
  }

  .fill-btn {
    flex-shrink: 0;
    min-height: 36px;
    padding: 0 14px;
    border: none;
    border-radius: 999px;
    background: var(--ink);
    color: var(--bg);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  .fill-btn:hover { opacity: 0.88 }
  .fill-btn.filling { opacity: 0.5; cursor: not-allowed }

  /* ── Empty / loading / error states ── */
  .state-center {
    padding: 30px 18px;
    text-align: center;
    color: var(--tinta-suave);
    font-size: 13px;
    font-weight: 700;
    line-height: 1.5;
  }
  .state-center .star { width: 56px; height: 56px; display: block; margin: 0 auto 8px }

  .spinner {
    display: inline-block;
    width: 22px;
    height: 22px;
    border: 3px solid var(--borde);
    border-top-color: var(--carmesi);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-bottom: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.4s }
    .cred-item { transition: none }
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 10px;
    left: 10px;
    right: 10px;
    padding: 12px 16px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 800;
    text-align: center;
    z-index: 999;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0) }
  .toast.success { background: var(--bosque); color: var(--lima) }
  .toast.error   { background: var(--carmesi-hondo); color: #fff }

  /* ── Settings ── */
  .settings-panel {
    margin: 0 12px 12px;
    padding: 16px;
    border-radius: 22px;
    background: var(--niebla);
  }
  .settings-panel p {
    font-size: 12px;
    color: var(--tinta-suave);
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .btn-danger {
    min-height: 40px;
    padding: 0 18px;
    border: 2px solid var(--carmesi-hondo);
    border-radius: 999px;
    background: #fff;
    color: var(--carmesi-hondo);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }
  .btn-danger:hover { background: var(--carmesi-hondo); color: #fff }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <svg width="32" height="32" viewBox="0 0 200 200" aria-hidden="true">
      <polygon points="100.0,4.0 114.2,19.2 132.8,9.8 141.0,29.0 161.7,26.5 162.8,47.3 183.1,52.0 177.1,72.0 194.5,83.3 182.0,100.0 194.5,116.7 177.1,128.0 183.1,148.0 162.8,152.7 161.7,173.5 141.0,171.0 132.8,190.2 114.2,180.8 100.0,196.0 85.8,180.8 67.2,190.2 59.0,171.0 38.3,173.5 37.2,152.7 16.9,148.0 22.9,128.0 5.5,116.7 18.0,100.0 5.5,83.3 22.9,72.0 16.9,52.0 37.2,47.3 38.3,26.5 59.0,29.0 67.2,9.8 85.8,19.2" fill="#ffd27a"/>
      <g transform="translate(50 46) scale(4.2)" fill="none" stroke="#b31f47" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g>
    </svg>
    Bóveda KF-1
  </div>
  <button class="gear-btn" id="gearBtn" title="Configuración" aria-label="Configuración">
    <svg width="16" height="16" viewBox="0 0 14 14" fill="none" aria-hidden="true">
      <circle cx="7" cy="7" r="2" stroke="currentColor" stroke-width="1.4"/>
      <path d="M7 1.5V3M7 11v1.5M1.5 7H3M11 7h1.5M3.05 3.05l1.06 1.06M9.89 9.89l1.06 1.06M10.95 3.05L9.89 4.11M4.11 9.89L3.05 10.95" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </button>
</div>

<div id="app"></div>
<div id="settingsPanel" class="settings-panel" style="display:none">
  <p>Conectado a kf1.kitifica.com. Para cambiar el token, desconectá tu cuenta.</p>
  <button class="btn-danger" id="disconnectBtn">Desconectar cuenta</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="popup.js"></script>
</body>
</html>
